<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Booking Details - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-3xl px-4 py-10 sm:px-6">
        <div class="mb-6"><a th:href="@{/bookings/list/all}" class="text-blue-600 hover:underline"><i class="fas fa-arrow-left mr-1"></i> All Bookings</a></div>
        <div th:if="${successMessage}" class="mb-4 rounded-xl bg-green-50 p-4 text-green-800"><span th:text="${successMessage}"></span></div>
        <div th:if="${errorMessage}" class="mb-4 rounded-xl bg-red-50 p-4 text-red-800"><span th:text="${errorMessage}"></span></div>
        <div class="rounded-2xl bg-white p-8 shadow-sm">
            <div class="flex items-center justify-between">
                <h1 class="text-2xl font-bold text-slate-900" th:text="'Booking ' + ${booking.bookingId}">Booking</h1>
                <span class="rounded-full px-3 py-1 text-sm font-medium"
                      th:classappend="${booking.status == 'CONFIRMED'} ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'"
                      th:text="${booking.status}">PENDING</span>
            </div>
            <div class="mt-6 grid gap-4 sm:grid-cols-2">
                <div class="rounded-xl bg-slate-50 p-4"><p class="text-sm text-slate-500">Room</p><p class="font-semibold text-slate-900" th:text="'Room ' + ${room.roomNumber}">Room</p></div>
                <div class="rounded-xl bg-slate-50 p-4"><p class="text-sm text-slate-500">Check-in</p><p class="font-semibold text-slate-900" th:text="${booking.checkInDate}">-</p></div>
                <div class="rounded-xl bg-slate-50 p-4"><p class="text-sm text-slate-500">Check-out</p><p class="font-semibold text-slate-900" th:text="${booking.checkOutDate}">-</p></div>
                <div class="rounded-xl bg-slate-50 p-4"><p class="text-sm text-slate-500">Nights</p><p class="font-semibold text-slate-900" th:text="${booking.numberOfNights}">0</p></div>
                <div class="rounded-xl bg-slate-50 p-4"><p class="text-sm text-slate-500">Guests</p><p class="font-semibold text-slate-900" th:text="${booking.numberOfGuests}">0</p></div>
                <div class="rounded-xl bg-slate-50 p-4"><p class="text-sm text-slate-500">Total</p><p class="text-xl font-bold text-slate-900" th:text="'Rs. ' + ${#numbers.formatInteger(booking.totalPrice, 1, 'COMMA')}">$0</p></div>
            </div>
            <div class="mt-6 flex flex-wrap gap-3">
                <!-- Pay Now -->
                <a th:if="${booking.paymentStatus != 'PAID' and booking.status != 'CANCELLED'}"
                   th:href="@{/payments/booking/{id}(id=${booking.bookingId})}"
                   class="rounded-xl bg-green-600 px-4 py-2 text-sm font-semibold text-white hover:bg-green-700 transition">
                    <i class="fas fa-credit-card mr-1"></i> Pay Now
                </a>
                <!-- View Invoice -->
                <a th:href="@{/invoices/booking/{id}(id=${booking.bookingId})}"
                   class="rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 transition">
                    <i class="fas fa-file-invoice mr-1"></i> View Invoice
                </a>
                <!-- Cancel -->
                <form th:action="@{/bookings/{id}/cancel(id=${booking.bookingId})}" method="post"
                      th:if="${booking.status != 'CANCELLED' and booking.status != 'CHECKED_OUT' and booking.status != 'Completed'}">
                    <button type="submit" class="rounded-xl bg-red-100 px-4 py-2 text-sm font-medium text-red-700 hover:bg-red-200">
                        <i class="fas fa-times mr-1"></i> Cancel Booking
                    </button>
                </form>
            </div>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
