<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Reports - Heaven Hotel</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-4xl px-4 py-10 sm:px-6">
        <h1 class="text-2xl font-bold text-slate-900">Reports</h1>
        <div class="mt-6 grid gap-4 sm:grid-cols-2">
            <div class="rounded-2xl bg-white p-6 shadow-sm"><i class="fas fa-chart-pie text-3xl text-blue-500"></i><h3 class="mt-3 font-semibold text-slate-900">Occupancy Report</h3><p class="mt-1 text-sm text-slate-500">Room occupancy statistics</p></div>
            <div class="rounded-2xl bg-white p-6 shadow-sm"><i class="fas fa-dollar-sign text-3xl text-green-500"></i><h3 class="mt-3 font-semibold text-slate-900">Revenue Report</h3><p class="mt-1 text-sm text-slate-500">Financial performance overview</p></div>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
