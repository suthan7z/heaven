<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Configuration - Heaven Hotel</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-2xl px-4 py-10 sm:px-6">
        <h1 class="text-2xl font-bold text-slate-900">Hotel Configuration</h1>
        <div class="mt-6 rounded-2xl bg-white p-8 shadow-sm">
            <div class="space-y-4">
                <div class="flex justify-between border-b border-slate-100 pb-3"><span class="text-slate-500">Hotel Name</span><span class="font-medium text-slate-900" th:text="${config.hotelName}">Heaven Hotel</span></div>
                <div class="flex justify-between border-b border-slate-100 pb-3"><span class="text-slate-500">Tax Rate</span><span class="font-medium text-slate-900" th:text="${config.taxRate * 100} + '%'">10%</span></div>
                <div class="flex justify-between border-b border-slate-100 pb-3"><span class="text-slate-500">Check-in Hour</span><span class="font-medium text-slate-900" th:text="${config.checkInHour} + ':00'">14:00</span></div>
                <div class="flex justify-between"><span class="text-slate-500">Check-out Hour</span><span class="font-medium text-slate-900" th:text="${config.checkOutHour} + ':00'">12:00</span></div>
            </div>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
