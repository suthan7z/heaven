<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Create Account - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center py-10 px-4">
<div class="w-full max-w-lg bg-white rounded-2xl shadow-lg p-8">

    <div class="text-center mb-6">
        <a th:href="@{/}" class="text-2xl font-bold text-slate-900"><i class="fas fa-hotel text-blue-600 mr-2"></i>Heaven Hotel</a>
        <h1 class="mt-3 text-xl font-semibold text-slate-800">Create Account</h1>
        <p class="mt-1 text-sm text-slate-500">Join Heaven Hotel and start booking today</p>
    </div>

    <div th:if="${errorMessage}" class="mb-4 rounded-xl bg-red-50 border border-red-200 p-3 text-sm text-red-700">
        <i class="fas fa-exclamation-circle mr-1"></i><span th:text="${errorMessage}"></span>
    </div>

    <form method="post" th:action="@{/auth/register}" id="registerForm" class="space-y-4" novalidate>

        <div class="grid grid-cols-2 gap-4">
            <div>
                <label class="block mb-1 text-sm font-medium text-slate-700">First Name</label>
                <input type="text" name="firstName" th:value="${firstName}" placeholder="John" required
                       class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>
            <div>
                <label class="block mb-1 text-sm font-medium text-slate-700">Last Name</label>
                <input type="text" name="lastName" th:value="${lastName}" placeholder="Doe" required
                       class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            </div>
        </div>

        <div>
            <label class="block mb-1 text-sm font-medium text-slate-700">Email Address</label>
            <input type="email" name="email" th:value="${email}" placeholder="john@example.com" required
                   class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div>
            <label class="block mb-1 text-sm font-medium text-slate-700">Phone Number</label>
            <input type="tel" name="phone" th:value="${phone}" placeholder="+1-555-123-4567" required
                   class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
        </div>

        <div>
            <label class="block mb-1 text-sm font-medium text-slate-700">Username</label>
            <input type="text" name="username" th:value="${username}" placeholder="johndoe"
                   pattern="^[a-zA-Z0-9_]{3,20}$" required
                   class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            <p class="mt-1 text-xs text-slate-400">3–20 characters, letters, numbers and underscores only</p>
        </div>

        <div>
            <label class="block mb-1 text-sm font-medium text-slate-700">Password</label>
            <div class="relative">
                <input type="password" id="password" name="password" placeholder="Create a strong password" required
                       class="w-full rounded-xl border border-slate-300 px-3 py-2 pr-10 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500"
                       oninput="checkStrength(this.value)">
                <button type="button" onclick="togglePwd('password',this)" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                    <i class="fas fa-eye text-sm"></i>
                </button>
            </div>
            <div id="strengthBar" class="mt-1 h-1 rounded-full bg-slate-200 overflow-hidden">
                <div id="strengthFill" class="h-full rounded-full transition-all duration-300 w-0"></div>
            </div>
            <p id="strengthLabel" class="mt-1 text-xs text-slate-400"></p>
            <p class="mt-1 text-xs text-slate-400">Min 8 chars with uppercase, lowercase, number and special char</p>
        </div>

        <div>
            <label class="block mb-1 text-sm font-medium text-slate-700">Confirm Password</label>
            <div class="relative">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat your password" required
                       class="w-full rounded-xl border border-slate-300 px-3 py-2 pr-10 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
                <button type="button" onclick="togglePwd('confirmPassword',this)" class="absolute right-3 top-2.5 text-slate-400 hover:text-slate-600">
                    <i class="fas fa-eye text-sm"></i>
                </button>
            </div>
            <p id="matchMsg" class="mt-1 text-xs hidden"></p>
        </div>

        <div class="flex items-start gap-2">
            <input type="checkbox" id="agreeTerms" name="agreeTerms" required class="mt-0.5 rounded border-slate-300">
            <label for="agreeTerms" class="text-sm text-slate-600">
                I agree to the <a href="#" class="text-blue-600 hover:underline">Terms of Service</a> and
                <a href="#" class="text-blue-600 hover:underline">Privacy Policy</a>
            </label>
        </div>

        <button type="submit"
                class="w-full rounded-xl bg-blue-600 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700 active:scale-95">
            <i class="fas fa-user-plus mr-1"></i> Create Account
        </button>
    </form>

    <p class="mt-5 text-center text-sm text-slate-500">
        Already have an account?
        <a th:href="@{/login}" class="font-medium text-blue-600 hover:underline">Sign in</a>
    </p>
</div>

<script>
function togglePwd(id, btn) {
    const input = document.getElementById(id);
    const isText = input.type === 'text';
    input.type = isText ? 'password' : 'text';
    btn.querySelector('i').className = isText ? 'fas fa-eye text-sm' : 'fas fa-eye-slash text-sm';
}

function checkStrength(pwd) {
    let score = 0;
    if (pwd.length >= 8) score++;
    if (pwd.length >= 12) score++;
    if (/[a-z]/.test(pwd)) score++;
    if (/[A-Z]/.test(pwd)) score++;
    if (/\d/.test(pwd)) score++;
    if (/[^A-Za-z0-9]/.test(pwd)) score++;
    const pct = Math.min(100, Math.round(score / 6 * 100));
    const fill = document.getElementById('strengthFill');
    const label = document.getElementById('strengthLabel');
    fill.style.width = pct + '%';
    const levels = [
        {pct: 0,  color: '',                  text: ''},
        {pct: 1,  color: 'bg-red-500',        text: 'Weak'},
        {pct: 34, color: 'bg-orange-400',     text: 'Fair'},
        {pct: 51, color: 'bg-yellow-400',     text: 'Good'},
        {pct: 68, color: 'bg-green-500',      text: 'Strong'},
        {pct: 84, color: 'bg-emerald-600',    text: 'Very Strong'},
    ];
    const level = levels.filter(l => pct >= l.pct).pop();
    fill.className = 'h-full rounded-full transition-all duration-300 ' + level.color;
    label.textContent = level.text;
    label.className = 'mt-1 text-xs ' + (pct >= 68 ? 'text-green-600' : pct >= 34 ? 'text-yellow-600' : 'text-red-500');
}

document.addEventListener('DOMContentLoaded', () => {
    const pwd = document.getElementById('password');
    const cpwd = document.getElementById('confirmPassword');
    const msg = document.getElementById('matchMsg');

    cpwd.addEventListener('input', () => {
        if (!cpwd.value) { msg.classList.add('hidden'); return; }
        const match = pwd.value === cpwd.value;
        msg.classList.remove('hidden');
        msg.textContent = match ? '✓ Passwords match' : '✗ Passwords do not match';
        msg.className = 'mt-1 text-xs ' + (match ? 'text-green-600' : 'text-red-500');
        cpwd.setCustomValidity(match ? '' : 'Passwords do not match');
    });

    document.getElementById('registerForm').addEventListener('submit', e => {
        if (pwd.value !== cpwd.value) {
            cpwd.setCustomValidity('Passwords do not match');
            e.preventDefault();
        }
    });
});
</script>
</body>
</html>
