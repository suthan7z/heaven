<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <div class="text-center mb-6">
        <a th:href="@{/}" class="text-2xl font-bold text-slate-900"><i class="fas fa-hotel text-blue-600 mr-2"></i>Heaven Hotel</a>
        <h1 class="mt-3 text-xl font-semibold text-slate-800">Forgot Password?</h1>
        <p class="mt-1 text-sm text-slate-500">Enter your email and we'll help you reset it</p>
    </div>

    <div th:if="${errorMessage}" class="mb-4 rounded-xl bg-red-50 border border-red-200 p-3 text-sm text-red-700">
        <i class="fas fa-exclamation-circle mr-1"></i><span th:text="${errorMessage}"></span>
    </div>
    <div th:if="${successMessage}" class="mb-4 rounded-xl bg-green-50 border border-green-200 p-3 text-sm text-green-700">
        <i class="fas fa-check-circle mr-1"></i><span th:text="${successMessage}"></span>
    </div>

    <form method="post" th:action="@{/auth/forgot-password}" class="space-y-4">
        <div>
            <label class="block mb-1 text-sm font-medium text-slate-700">Email Address</label>
            <input type="email" name="email" placeholder="your@email.com" required autofocus
                   class="w-full rounded-xl border border-slate-300 px-3 py-2 text-sm focus:border-blue-500 focus:outline-none focus:ring-1 focus:ring-blue-500">
            <p class="mt-1 text-xs text-slate-400">We'll confirm if an account exists for this email.</p>
        </div>

        <button type="submit"
                class="w-full rounded-xl bg-blue-600 py-2.5 text-sm font-semibold text-white transition hover:bg-blue-700">
            <i class="fas fa-envelope mr-1"></i> Send Reset Instructions
        </button>
    </form>

    <div class="mt-6 text-center space-y-2">
        <a th:href="@{/login}" class="block text-sm text-blue-600 hover:underline">
            <i class="fas fa-arrow-left mr-1"></i> Back to Login
        </a>
        <p class="text-xs text-slate-400">Still having trouble? <a th:href="@{/contact}" class="text-blue-600 hover:underline">Contact Support</a></p>
    </div>
</div>
</body>
</html>
