<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Inventory - Heaven Hotel</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
        <h1 class="text-2xl font-bold text-slate-900">Room Inventory</h1>
        <div class="mt-4 flex gap-4 text-sm">
            <span class="rounded-xl bg-blue-100 px-3 py-1 text-blue-700" th:text="'Total: ' + ${totalRooms}">Total: 0</span>
            <span class="rounded-xl bg-green-100 px-3 py-1 text-green-700" th:text="'Available: ' + ${availableRooms}">Available: 0</span>
            <span class="rounded-xl bg-red-100 px-3 py-1 text-red-700" th:text="'Occupied: ' + ${occupiedRooms}">Occupied: 0</span>
        </div>
        <div class="mt-6">
            <a th:href="@{/rooms}" class="inline-block rounded-xl bg-blue-600 px-4 py-2 text-sm font-medium text-white hover:bg-blue-700">View Full Room List</a>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
