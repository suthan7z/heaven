<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Room Management - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50">
<div th:insert="~{fragments/navbar :: navbar}"></div>

<main class="mx-auto max-w-7xl px-4 py-8 sm:px-6 lg:px-8">

    <div class="mb-6 flex flex-col gap-3 sm:flex-row sm:items-center sm:justify-between">
        <div>
            <h1 class="text-2xl font-bold text-slate-900"><i class="fas fa-door-open text-blue-600 mr-2"></i>Room Management</h1>
            <p class="mt-1 text-sm text-slate-500">Manage hotel rooms and availability</p>
        </div>
        <a th:href="@{/rooms/add}" class="inline-flex items-center gap-2 rounded-xl bg-blue-600 px-4 py-2 text-sm font-semibold text-white hover:bg-blue-700 transition">
            <i class="fas fa-plus"></i> Add New Room
        </a>
    </div>

    <div th:if="${successMessage}" class="mb-4 rounded-xl bg-green-50 border border-green-200 p-3 text-sm text-green-700">
        <i class="fas fa-check-circle mr-1"></i><span th:text="${successMessage}"></span>
    </div>
    <div th:if="${errorMessage}" class="mb-4 rounded-xl bg-red-50 border border-red-200 p-3 text-sm text-red-700">
        <i class="fas fa-exclamation-circle mr-1"></i><span th:text="${errorMessage}"></span>
    </div>

    <div class="mb-6 grid gap-4 sm:grid-cols-4">
        <div class="rounded-2xl bg-white p-5 shadow-sm border border-slate-100 text-center">
            <p class="text-xs font-semibold uppercase tracking-wide text-slate-400">Total Rooms</p>
            <p class="mt-1 text-3xl font-bold text-slate-900" th:text="${totalRooms}">0</p>
        </div>
        <div class="rounded-2xl bg-white p-5 shadow-sm border border-slate-100 text-center">
            <p class="text-xs font-semibold uppercase tracking-wide text-green-500">Available</p>
            <p class="mt-1 text-3xl font-bold text-green-600" th:text="${availableRooms}">0</p>
        </div>
        <div class="rounded-2xl bg-white p-5 shadow-sm border border-slate-100 text-center">
            <p class="text-xs font-semibold uppercase tracking-wide text-red-400">Occupied</p>
            <p class="mt-1 text-3xl font-bold text-red-500" th:text="${occupiedRooms}">0</p>
        </div>
        <div class="rounded-2xl bg-white p-5 shadow-sm border border-slate-100 text-center">
            <p class="text-xs font-semibold uppercase tracking-wide text-purple-400">Occupancy</p>
            <p class="mt-1 text-3xl font-bold text-purple-600" th:text="${occupancyRate}">0%</p>
        </div>
    </div>

    <form method="get" th:action="@{/rooms}" class="mb-5 flex gap-3">
        <input type="text" name="filter" th:value="${filter}" placeholder="Search by room number, type or description..."
               class="flex-1 rounded-xl border border-slate-300 px-4 py-2 text-sm focus:border-blue-500 focus:outline-none">
        <button type="submit" class="rounded-xl bg-slate-800 px-4 py-2 text-sm font-medium text-white hover:bg-slate-700">
            <i class="fas fa-search mr-1"></i> Search
        </button>
        <a th:if="${filter}" th:href="@{/rooms}" class="rounded-xl border border-slate-300 px-4 py-2 text-sm text-slate-600 hover:bg-slate-50">Clear</a>
    </form>

    <div class="overflow-hidden rounded-2xl bg-white shadow-sm border border-slate-100">
        <table class="w-full text-sm">
            <thead class="bg-slate-50 border-b border-slate-100">
                <tr>
                    <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-400">Room</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-400">Type</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-400">Capacity</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-400">Price/Night</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-400">Status</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-400">Amenities</th>
                    <th class="px-5 py-3 text-left text-xs font-semibold uppercase tracking-wide text-slate-400">Actions</th>
                </tr>
            </thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="room : ${rooms}" class="hover:bg-slate-50 transition">
                    <td class="px-5 py-4 font-semibold text-slate-900">
                        <i class="fas fa-door-open text-blue-400 mr-1"></i><span th:text="${room.roomNumber}">101</span>
                    </td>
                    <td class="px-5 py-4">
                        <span th:if="${room.roomType == 'STANDARD'}" class="rounded-full bg-blue-100 px-2 py-0.5 text-xs font-medium text-blue-700">Standard</span>
                        <span th:if="${room.roomType == 'SUITE'}"    class="rounded-full bg-amber-100 px-2 py-0.5 text-xs font-medium text-amber-700">Suite</span>
                    </td>
                    <td class="px-5 py-4 text-slate-600" th:text="${room.capacity} + ' guests'">2</td>
                    <td class="px-5 py-4 font-semibold text-slate-900" th:text="'$' + ${#numbers.formatDecimal(room.pricePerNight, 1, 2)}">$0</td>
                    <td class="px-5 py-4">
                        <span th:if="${room.status == 'AVAILABLE'}"   class="rounded-full bg-green-100 px-2 py-0.5 text-xs font-medium text-green-700">Available</span>
                        <span th:if="${room.status == 'OCCUPIED'}"    class="rounded-full bg-red-100 px-2 py.0.5 text-xs font-medium text-red-600">Occupied</span>
                        <span th:if="${room.status == 'MAINTENANCE'}" class="rounded-full bg-orange-100 px-2 py-0.5 text-xs font-medium text-orange-600">Maintenance</span>
                        <span th:if="${room.status == 'RESERVED'}"    class="rounded-full bg-purple-100 px-2 py-0.5 text-xs font-medium text-purple-600">Reserved</span>
                    </td>
                    <td class="px-5 py-4">
                        <div class="flex flex-wrap gap-1">
                            <span th:if="${room.hasAC}"      class="rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-600">AC</span>
                            <span th:if="${room.hasWifi}"    class="rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-600">WiFi</span>
                            <span th:if="${room.hasTV}"      class="rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-600">TV</span>
                            <span th:if="${room.hasKitchen}" class="rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-600">Kitchen</span>
                            <span th:if="${room.hasBalcony}" class="rounded bg-slate-100 px-1.5 py-0.5 text-xs text-slate-600">Balcony</span>
                        </div>
                    </td>
                    <td class="px-5 py-4">
                        <div class="flex items-center gap-2">
                            <a th:href="@{/rooms/{id}(id=${room.roomId})}" class="rounded-lg bg-blue-50 p-1.5 text-blue-600 hover:bg-blue-100" title="View"><i class="fas fa-eye text-xs"></i></a>
                            <a th:href="@{/rooms/{id}/edit(id=${room.roomId})}" class="rounded-lg bg-amber-50 p-1.5 text-amber-600 hover:bg-amber-100" title="Edit"><i class="fas fa-edit text-xs"></i></a>
                            <form th:action="@{/rooms/{id}/delete(id=${room.roomId})}" method="post"
                                  th:data-num="${room.roomNumber}"
                                  onsubmit="return confirm('Delete room ' + this.dataset.num + '?')">
                                <button type="submit" class="rounded-lg bg-red-50 p-1.5 text-red-600 hover:bg-red-100" title="Delete"><i class="fas fa-trash text-xs"></i></button>
                            </form>
                        </div>
                    </td>
                </tr>
                <tr th:if="${rooms == null or #lists.isEmpty(rooms)}">
                    <td colspan="7" class="px-5 py-12 text-center text-slate-400">
                        <i class="fas fa-inbox text-4xl mb-2 block"></i>No rooms found
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</main>

<div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
