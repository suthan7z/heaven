<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Maintenance - Heaven Hotel</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
        <h1 class="text-2xl font-bold text-slate-900">Maintenance Requests</h1>
        <div th:if="${requests != null and !#lists.isEmpty(requests)}" class="mt-6 space-y-3">
            <div th:each="r : ${requests}" class="rounded-2xl bg-white p-5 shadow-sm">
                <div class="flex items-center justify-between">
                    <span class="font-semibold text-slate-900" th:text="${r.type + ' — Room ' + r.roomId}">-</span>
                    <span class="rounded-full px-2 py-1 text-xs font-medium"
                          th:classappend="${r.priority == 'URGENT'} ? 'bg-red-100 text-red-700' : 'bg-amber-100 text-amber-700'"
                          th:text="${r.priority}">-</span>
                </div>
                <p class="mt-1 text-sm text-slate-500" th:text="${r.description}">-</p>
                <p class="mt-2 text-xs text-slate-400" th:text="${r.status}">PENDING</p>
            </div>
        </div>
        <div th:if="${requests == null or #lists.isEmpty(requests)}" class="mt-10 text-center text-slate-500"><p>No maintenance requests.</p></div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
