<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Heaven Hotel'">Edit Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-2xl px-4 py-10 sm:px-6">
        <div class="mb-6"><a th:href="@{/rooms}" class="text-blue-600 hover:underline"><i class="fas fa-arrow-left mr-1"></i> Back to Rooms</a></div>
        <div class="rounded-2xl bg-white p-8 shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900" th:text="${pageTitle}">Edit Room</h1>
            <form th:action="@{/rooms/{id}/edit(id=${room.roomId})}" method="post" class="mt-6 space-y-5">
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Room Number</label>
                    <input type="number" name="roomNumber" th:value="${room.roomNumber}" required class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Price per Night ($)</label>
                    <input type="number" step="0.01" name="pricePerNight" th:value="${room.pricePerNight}" required class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none">
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Description</label>
                    <textarea name="description" rows="3" class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none" th:text="${room.description}"></textarea>
                </div>
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Status</label>
                    <select name="status" class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none">
                        <option value="AVAILABLE" th:selected="${room.status == 'AVAILABLE'}">Available</option>
                        <option value="OCCUPIED" th:selected="${room.status == 'OCCUPIED'}">Occupied</option>
                        <option value="MAINTENANCE" th:selected="${room.status == 'MAINTENANCE'}">Maintenance</option>
                        <option value="RESERVED" th:selected="${room.status == 'RESERVED'}">Reserved</option>
                    </select>
                </div>
                <div class="flex gap-3 pt-2">
                    <button type="submit" class="rounded-xl bg-blue-600 px-6 py-2 text-sm font-medium text-white hover:bg-blue-700">Save Changes</button>
                    <a th:href="@{/rooms}" class="rounded-xl bg-slate-100 px-6 py-2 text-sm font-medium text-slate-700 hover:bg-slate-200">Cancel</a>
                </div>
            </form>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
