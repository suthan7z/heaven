<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Check-Out - Heaven Hotel</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-4xl px-4 py-10 sm:px-6">
        <h1 class="text-2xl font-bold text-slate-900">Guest Check-Out</h1>
        <div th:if="${successMessage}" class="mt-4 rounded-xl bg-green-50 p-4 text-green-800" th:text="${successMessage}"></div>
        <div th:if="${errorMessage}" class="mt-4 rounded-xl bg-red-50 p-4 text-red-800" th:text="${errorMessage}"></div>
        <div th:if="${checkedInBookings != null and !#lists.isEmpty(checkedInBookings)}" class="mt-6 space-y-3">
            <div th:each="b : ${checkedInBookings}" class="flex items-center justify-between rounded-2xl bg-white p-5 shadow-sm">
                <div>
                    <p class="font-semibold text-slate-900" th:text="'Booking ' + ${b.bookingId}">-</p>
                    <p class="text-sm text-slate-500" th:text="${b.checkInDate} + ' → ' + ${b.checkOutDate}">-</p>
                </div>
                <form th:action="@{/reception/checkout/{id}(id=${b.bookingId})}" method="post">
                    <button type="submit" class="rounded-xl bg-amber-500 px-4 py-2 text-sm font-medium text-white hover:bg-amber-600">Check Out</button>
                </form>
            </div>
        </div>
        <div th:if="${checkedInBookings == null or #lists.isEmpty(checkedInBookings)}" class="mt-10 text-center text-slate-500"><p>No guests currently checked in.</p></div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
