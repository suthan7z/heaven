<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-3xl px-4 py-16 sm:px-6 lg:px-8">
        <h1 class="text-4xl font-bold text-slate-900 text-center">Contact Us</h1>
        <div class="mt-10 grid gap-6 sm:grid-cols-3 text-center">
            <div class="rounded-2xl bg-white p-8 shadow-sm"><i class="fas fa-phone text-3xl text-blue-500"></i><p class="mt-3 font-semibold text-slate-900">Phone</p><p class="mt-1 text-slate-500">+1 (555) 123-4567</p></div>
            <div class="rounded-2xl bg-white p-8 shadow-sm"><i class="fas fa-envelope text-3xl text-green-500"></i><p class="mt-3 font-semibold text-slate-900">Email</p><p class="mt-1 text-slate-500">info@heavenhotel.com</p></div>
            <div class="rounded-2xl bg-white p-8 shadow-sm"><i class="fas fa-map-marker-alt text-3xl text-red-500"></i><p class="mt-3 font-semibold text-slate-900">Address</p><p class="mt-1 text-slate-500">123 Luxury Street, Paradise City</p></div>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
