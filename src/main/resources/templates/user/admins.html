<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Admin Users - Heaven Hotel</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-4xl px-4 py-10 sm:px-6">
        <h1 class="text-2xl font-bold text-slate-900">Admin Users</h1>
        <div th:if="${admins != null and !#lists.isEmpty(admins)}" class="mt-6 space-y-3">
            <div th:each="a : ${admins}" class="rounded-2xl bg-white p-5 shadow-sm flex items-center gap-4">
                <div class="flex h-10 w-10 items-center justify-center rounded-full bg-red-100 text-red-600"><i class="fas fa-shield-alt"></i></div>
                <div><p class="font-semibold text-slate-900" th:text="${a.firstName + ' ' + a.lastName}">-</p><p class="text-sm text-slate-500" th:text="${a.email}">-</p></div>
            </div>
        </div>
        <div th:if="${admins == null or #lists.isEmpty(admins)}" class="mt-10 text-center text-slate-500"><p>No admin users found.</p></div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
