<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Reviews - Heaven Hotel</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-4xl px-4 py-10 sm:px-6">
        <div class="flex items-center justify-between">
            <h1 class="text-2xl font-bold text-slate-900">Guest Reviews</h1>
            <span class="rounded-full bg-amber-100 px-3 py-1 text-sm font-semibold text-amber-700">
                <i class="fas fa-star mr-1"></i><span th:text="${#numbers.formatDecimal(averageRating, 1, 1)}">0.0</span> avg
            </span>
        </div>
        <div th:if="${reviews != null and !#lists.isEmpty(reviews)}" class="mt-6 space-y-4">
            <div th:each="r : ${reviews}" class="rounded-2xl bg-white p-6 shadow-sm">
                <div class="flex items-center justify-between">
                    <p class="font-semibold text-slate-900" th:text="${r.title}">-</p>
                    <div class="flex text-amber-400">
                        <i th:each="i : ${#numbers.sequence(1, r.rating)}" class="fas fa-star text-sm"></i>
                    </div>
                </div>
                <p class="mt-2 text-slate-600" th:text="${r.comment}">-</p>
            </div>
        </div>
        <div th:if="${reviews == null or #lists.isEmpty(reviews)}" class="mt-10 text-center text-slate-500">
            <i class="fas fa-star text-5xl text-slate-300"></i><p class="mt-4">No reviews yet.</p>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
