<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>

    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6 lg:px-8">
        <div class="mb-8 flex items-center justify-between">
            <div>
                <h1 class="text-2xl font-bold text-slate-900">Admin Dashboard</h1>
                <p class="mt-1 text-slate-500">System overview and management</p>
            </div>
            <span class="rounded-full bg-red-100 px-3 py-1 text-sm font-semibold text-red-700">
                <i class="fas fa-shield-alt mr-1"></i> Admin
            </span>
        </div>

        <!-- Stats Grid -->
        <div class="grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <div class="rounded-2xl bg-white p-6 shadow-sm border border-slate-100">
                <div class="flex items-center gap-4">
                    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-blue-100 text-blue-600">
                        <i class="fas fa-bed text-xl"></i>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500">Total Rooms</p>
                        <p class="text-2xl font-bold text-slate-900" th:text="${stats['totalRooms'] ?: 0}">0</p>
                    </div>
                </div>
                <div class="mt-4 flex gap-3 text-sm">
                    <span class="text-green-600" th:text="${stats['availableRooms'] ?: 0} + ' available'">0 available</span>
                    <span class="text-red-500" th:text="${stats['occupiedRooms'] ?: 0} + ' occupied'">0 occupied</span>
                </div>
            </div>

            <div class="rounded-2xl bg-white p-6 shadow-sm border border-slate-100">
                <div class="flex items-center gap-4">
                    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-amber-100 text-amber-600">
                        <i class="fas fa-calendar text-xl"></i>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500">Bookings</p>
                        <p class="text-2xl font-bold text-slate-900" th:text="${stats['totalBookings'] ?: 0}">0</p>
                    </div>
                </div>
                <div class="mt-4 flex gap-3 text-sm">
                    <span class="text-amber-600" th:text="${stats['pendingBookings'] ?: 0} + ' pending'">0 pending</span>
                    <span class="text-green-600" th:text="${stats['confirmedBookings'] ?: 0} + ' confirmed'">0 confirmed</span>
                </div>
            </div>

            <div class="rounded-2xl bg-white p-6 shadow-sm border border-slate-100">
                <div class="flex items-center gap-4">
                    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-green-100 text-green-600">
                        <i class="fas fa-users text-xl"></i>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500">Users</p>
                        <p class="text-2xl font-bold text-slate-900" th:text="${stats['totalUsers'] ?: 0}">0</p>
                    </div>
                </div>
                <div class="mt-4 flex gap-3 text-sm">
                    <span class="text-blue-600" th:text="${stats['totalGuests'] ?: 0} + ' guests'">0 guests</span>
                    <span class="text-purple-600" th:text="${stats['totalStaff'] ?: 0} + ' staff'">0 staff</span>
                </div>
            </div>

            <div class="rounded-2xl bg-white p-6 shadow-sm border border-slate-100 lg:col-span-3">
                <div class="flex items-center gap-4">
                    <div class="flex h-12 w-12 items-center justify-center rounded-xl bg-purple-100 text-purple-600">
                        <i class="fas fa-chart-line text-xl"></i>
                    </div>
                    <div>
                        <p class="text-sm text-slate-500">Occupancy Rate</p>
                        <p class="text-3xl font-bold text-slate-900" th:text="${stats['occupancyRate'] ?: '0.0%'}">0%</p>
                    </div>
                </div>
            </div>
        </div>

        <!-- Admin Quick Actions -->
        <div class="mt-10">
            <h2 class="mb-4 text-lg font-semibold text-slate-900">Quick Actions</h2>
            <div class="grid gap-4 sm:grid-cols-2 lg:grid-cols-4">
                <a th:href="@{/rooms}" class="flex items-center gap-3 rounded-2xl bg-blue-600 p-4 text-white transition hover:bg-blue-700">
                    <i class="fas fa-bed text-xl"></i>
                    <span class="font-medium">Manage Rooms</span>
                </a>
                <a th:href="@{/bookings/list/all}" class="flex items-center gap-3 rounded-2xl bg-amber-500 p-4 text-white transition hover:bg-amber-600">
                    <i class="fas fa-calendar-alt text-xl"></i>
                    <span class="font-medium">All Bookings</span>
                </a>
                <a th:href="@{/guests}" class="flex items-center gap-3 rounded-2xl bg-green-600 p-4 text-white transition hover:bg-green-700">
                    <i class="fas fa-users text-xl"></i>
                    <span class="font-medium">Guest List</span>
                </a>
                <a th:href="@{/admin/reports}" class="flex items-center gap-3 rounded-2xl bg-purple-600 p-4 text-white transition hover:bg-purple-700">
                    <i class="fas fa-chart-bar text-xl"></i>
                    <span class="font-medium">Reports</span>
                </a>
            </div>
        </div>
    </main>

    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
