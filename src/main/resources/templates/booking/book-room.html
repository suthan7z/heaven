<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${pageTitle} + ' - Heaven Hotel'">Book Room</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-2xl px-4 py-10 sm:px-6">
        <div class="mb-6"><a href="javascript:history.back()" class="text-blue-600 hover:underline"><i class="fas fa-arrow-left mr-1"></i> Back</a></div>
        <div class="rounded-2xl bg-white p-8 shadow-sm">
            <h1 class="text-2xl font-bold text-slate-900" th:text="${pageTitle}">Book Room</h1>

            <!-- Room summary -->
            <div class="mt-4 rounded-xl bg-slate-50 p-4">
                <p class="font-semibold text-slate-900" th:text="'Room ' + ${room.roomNumber} + ' — ' + ${room.roomType}">Room</p>
                <div class="mt-2 grid grid-cols-3 gap-3 text-sm text-slate-600">
                    <span><i class="fas fa-calendar mr-1"></i><span th:text="${checkInDate}"></span></span>
                    <span><i class="fas fa-calendar-check mr-1"></i><span th:text="${checkOutDate}"></span></span>
                    <span><i class="fas fa-moon mr-1"></i><span th:text="${numberOfNights} + ' nights'"></span></span>
                </div>
                <div class="mt-3 border-t border-slate-200 pt-3 flex justify-between text-sm">
                    <span class="text-slate-500">Base price</span><span th:text="'Rs. ' + ${#numbers.formatInteger(basePrice, 1, 'COMMA')}">$0</span>
                </div>
                <div class="flex justify-between text-sm">
                    <span class="text-slate-500">Tax (10%)</span><span th:text="'Rs. ' + ${#numbers.formatInteger(taxAmount, 1, 'COMMA')}">$0</span>
                </div>
                <div class="flex justify-between font-semibold text-slate-900 pt-2 border-t border-slate-200 mt-2">
                    <span>Total</span><span th:text="'Rs. ' + ${#numbers.formatInteger(totalPrice, 1, 'COMMA')}">$0</span>
                </div>
            </div>

            <!-- Booking form -->
            <form th:action="@{/bookings/create}" method="post" class="mt-6 space-y-4">
                <input type="hidden" name="roomId" th:value="${room.roomId}">
                <input type="hidden" name="checkInDate" th:value="${checkInDate}">
                <input type="hidden" name="checkOutDate" th:value="${checkOutDate}">
                <input type="hidden" name="numberOfGuests" th:value="${numberOfGuests}">
                <div>
                    <label class="mb-1 block text-sm font-medium text-slate-700">Special Requests</label>
                    <textarea name="specialRequests" rows="3" placeholder="Any special requirements?" class="w-full rounded-xl border border-slate-300 px-4 py-2 focus:border-blue-500 focus:outline-none"></textarea>
                </div>
                <button type="submit" class="w-full rounded-xl bg-blue-600 py-3 font-medium text-white transition hover:bg-blue-700">
                    <i class="fas fa-check mr-2"></i>Confirm Booking
                </button>
            </form>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
