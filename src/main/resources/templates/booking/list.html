<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>All Bookings - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
        <h1 class="text-2xl font-bold text-slate-900" th:text="${pageTitle}">All Bookings</h1>
        <div th:if="${bookings != null and !#lists.isEmpty(bookings)}" class="mt-6 overflow-hidden rounded-2xl bg-white shadow-sm">
            <table class="w-full text-sm">
                <thead class="bg-slate-50 text-left text-xs font-semibold uppercase text-slate-500">
                    <tr>
                        <th class="px-6 py-4">Booking ID</th>
                        <th class="px-6 py-4">Check-in</th>
                        <th class="px-6 py-4">Check-out</th>
                        <th class="px-6 py-4">Guests</th>
                        <th class="px-6 py-4">Total</th>
                        <th class="px-6 py-4">Status</th>
                        <th class="px-6 py-4">Actions</th>
                    </tr>
                </thead>
                <tbody class="divide-y divide-slate-100">
                    <tr th:each="b : ${bookings}" class="hover:bg-slate-50">
                        <td class="px-6 py-4 font-mono text-xs" th:text="${b.bookingId}">BKG001</td>
                        <td class="px-6 py-4" th:text="${b.checkInDate}">-</td>
                        <td class="px-6 py-4" th:text="${b.checkOutDate}">-</td>
                        <td class="px-6 py-4" th:text="${b.numberOfGuests}">0</td>
                        <td class="px-6 py-4 font-semibold" th:text="'Rs. ' + ${#numbers.formatInteger(b.totalPrice, 1, 'COMMA')}">$0</td>
                        <td class="px-6 py-4">
                            <span class="rounded-full px-2 py-1 text-xs font-medium"
                                  th:classappend="${b.status == 'CONFIRMED'} ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'"
                                  th:text="${b.status}">PENDING</span>
                        </td>
                        <td class="px-6 py-4">
                            <div class="flex items-center gap-3">
                            <a th:href="@{/bookings/{id}(id=${b.bookingId})}" class="text-blue-600 hover:underline text-sm">View</a>
                            <a th:if="${b.paymentStatus != 'PAID' and b.status != 'CANCELLED'}"
                               th:href="@{/payments/booking/{id}(id=${b.bookingId})}"
                               class="rounded-lg bg-green-100 px-2 py-1 text-xs font-semibold text-green-700 hover:bg-green-200">Pay</a>
                            <a th:href="@{/invoices/booking/{id}(id=${b.bookingId})}"
                               class="rounded-lg bg-blue-100 px-2 py-1 text-xs font-semibold text-blue-700 hover:bg-blue-200">Invoice</a>
                            </div>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div th:if="${bookings == null or #lists.isEmpty(bookings)}" class="mt-10 text-center text-slate-500">
            <i class="fas fa-calendar text-5xl text-slate-300"></i>
            <p class="mt-4">No bookings found.</p>
            <a th:href="@{/bookings}" class="mt-3 inline-block rounded-xl bg-blue-600 px-4 py-2 text-sm font-medium text-white">Make a Booking</a>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
