<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Rooms - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
        <div class="mb-6"><a th:href="@{/bookings}" class="text-blue-600 hover:underline"><i class="fas fa-arrow-left mr-1"></i> New Search</a></div>
        <h1 class="text-2xl font-bold text-slate-900">Available Rooms</h1>
        <p class="mt-1 text-slate-500">
            <span th:text="${checkInDate}"></span> → <span th:text="${checkOutDate}"></span>
            &nbsp;·&nbsp; <span th:text="${numberOfNights}"></span> night(s)
            &nbsp;·&nbsp; <span th:text="${numberOfGuests}"></span> guest(s)
        </p>
        <div th:if="${availableRooms != null and !#lists.isEmpty(availableRooms)}" class="mt-8 grid gap-6 sm:grid-cols-2 lg:grid-cols-3">
            <div th:each="room : ${availableRooms}" class="rounded-2xl bg-white p-6 shadow-sm border border-slate-100">
                <div class="flex items-center justify-between">
                    <span class="font-semibold text-slate-900" th:text="'Room ' + ${room.roomNumber}">Room</span>
                    <span class="rounded-full bg-green-100 px-2 py-1 text-xs font-medium text-green-700">Available</span>
                </div>
                <p class="mt-1 text-sm text-slate-500" th:text="${room.roomType}">STANDARD</p>
                <p class="mt-3 text-2xl font-bold text-slate-900" th:text="'$' + ${#numbers.formatDecimal(room.pricePerNight, 1, 2)} + '/night'">$0/night</p>
                <a th:href="@{/bookings/room/{id}(id=${room.roomId}, checkInDate=${checkInDate}, checkOutDate=${checkOutDate}, numberOfGuests=${numberOfGuests})}"
                   class="mt-4 block rounded-xl bg-blue-600 py-2 text-center text-sm font-medium text-white hover:bg-blue-700">Select Room</a>
            </div>
        </div>
        <div th:if="${availableRooms == null or #lists.isEmpty(availableRooms)}" class="mt-10 text-center text-slate-500">
            <i class="fas fa-bed text-5xl text-slate-300"></i>
            <p class="mt-4">No available rooms for the selected dates.</p>
            <a th:href="@{/bookings}" class="mt-3 inline-block rounded-xl bg-blue-600 px-4 py-2 text-sm font-medium text-white">Try Different Dates</a>
        </div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
