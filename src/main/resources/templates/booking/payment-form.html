<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Payment - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-50">
<div th:insert="~{fragments/navbar :: navbar}"></div>

<main class="mx-auto max-w-2xl px-4 py-10 sm:px-6">

    <div class="mb-6">
        <a th:href="@{/bookings/{id}(id=${booking.bookingId})}" class="text-blue-600 hover:underline text-sm">
            <i class="fas fa-arrow-left mr-1"></i> Back to Booking
        </a>
    </div>

    <div th:if="${errorMessage}" class="mb-4 rounded-xl bg-red-50 border border-red-200 p-3 text-sm text-red-700">
        <i class="fas fa-exclamation-circle mr-1"></i><span th:text="${errorMessage}"></span>
    </div>

    <!-- Booking summary card -->
    <div class="rounded-2xl bg-white shadow-sm border border-slate-100 p-6 mb-6">
        <div class="flex items-center gap-3 mb-4">
            <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-100 text-blue-600">
                <i class="fas fa-calendar-check"></i>
            </div>
            <div>
                <p class="font-bold text-slate-900" th:text="'Booking ' + ${booking.bookingId}">Booking</p>
                <p class="text-xs text-slate-500" th:text="'Room ' + ${room.roomNumber} + ' · ' + ${room.tierLabel}">Room</p>
            </div>
            <span class="ml-auto rounded-full px-3 py-1 text-xs font-semibold"
                  th:classappend="${booking.paymentStatus == 'PAID'} ? 'bg-green-100 text-green-700' : 'bg-amber-100 text-amber-700'"
                  th:text="${booking.paymentStatus}">UNPAID</span>
        </div>

        <div class="grid grid-cols-2 gap-3 text-sm">
            <div class="rounded-xl bg-slate-50 p-3">
                <p class="text-slate-400 text-xs">Check-in</p>
                <p class="font-semibold text-slate-800" th:text="${booking.checkInDate}">-</p>
            </div>
            <div class="rounded-xl bg-slate-50 p-3">
                <p class="text-slate-400 text-xs">Check-out</p>
                <p class="font-semibold text-slate-800" th:text="${booking.checkOutDate}">-</p>
            </div>
            <div class="rounded-xl bg-slate-50 p-3">
                <p class="text-slate-400 text-xs">Duration</p>
                <p class="font-semibold text-slate-800" th:text="${booking.numberOfNights} + ' night(s)'">-</p>
            </div>
            <div class="rounded-xl bg-slate-50 p-3">
                <p class="text-slate-400 text-xs">Guests</p>
                <p class="font-semibold text-slate-800" th:text="${booking.numberOfGuests}">-</p>
            </div>
        </div>

        <!-- Price breakdown -->
        <div class="mt-4 border-t border-slate-100 pt-4 space-y-2 text-sm">
            <div class="flex justify-between text-slate-600">
                <span>Room charge (<span th:text="${booking.numberOfNights}">0</span> nights)</span>
                <span th:text="'Rs. ' + ${#numbers.formatInteger(booking.subtotal, 1, 'COMMA')}">Rs. 0</span>
            </div>
            <div class="flex justify-between text-slate-600" th:if="${booking.discountAmount > 0}">
                <span>Discount</span>
                <span class="text-green-600" th:text="'- Rs. ' + ${#numbers.formatInteger(booking.discountAmount, 1, 'COMMA')}">Rs. 0</span>
            </div>
            <div class="flex justify-between text-slate-600">
                <span>Tax (10%)</span>
                <span th:text="'Rs. ' + ${#numbers.formatInteger(booking.taxAmount, 1, 'COMMA')}">Rs. 0</span>
            </div>
            <div class="flex justify-between border-t border-slate-200 pt-2 font-bold text-slate-900 text-base">
                <span>Total Payable</span>
                <span th:text="'Rs. ' + ${#numbers.formatInteger(booking.totalPrice, 1, 'COMMA')}">Rs. 0</span>
            </div>
        </div>
    </div>

    <!-- Payment form -->
    <div class="rounded-2xl bg-white shadow-sm border border-slate-100 p-6"
         th:if="${booking.paymentStatus != 'PAID'}">

        <h2 class="text-lg font-bold text-slate-900 mb-5">
            <i class="fas fa-credit-card text-blue-500 mr-2"></i>Select Payment Method
        </h2>

        <form th:action="@{/payments/booking/{id}/pay(id=${booking.bookingId})}" method="post">

            <div class="space-y-3 mb-6">
                <!-- Card -->
                <label class="flex items-center gap-4 rounded-xl border-2 border-slate-200 p-4 cursor-pointer hover:border-blue-400 transition has-[:checked]:border-blue-500 has-[:checked]:bg-blue-50">
                    <input type="radio" name="paymentMethod" value="Card" class="accent-blue-600" required>
                    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-blue-100 text-blue-600">
                        <i class="fas fa-credit-card"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-slate-900">Credit / Debit Card</p>
                        <p class="text-xs text-slate-500">Visa, Mastercard, Amex accepted</p>
                    </div>
                </label>

                <!-- Cash -->
                <label class="flex items-center gap-4 rounded-xl border-2 border-slate-200 p-4 cursor-pointer hover:border-green-400 transition has-[:checked]:border-green-500 has-[:checked]:bg-green-50">
                    <input type="radio" name="paymentMethod" value="Cash" class="accent-green-600">
                    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-green-100 text-green-600">
                        <i class="fas fa-money-bill-wave"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-slate-900">Cash at Reception</p>
                        <p class="text-xs text-slate-500">Pay in person at the hotel front desk</p>
                    </div>
                </label>

                <!-- Online -->
                <label class="flex items-center gap-4 rounded-xl border-2 border-slate-200 p-4 cursor-pointer hover:border-purple-400 transition has-[:checked]:border-purple-500 has-[:checked]:bg-purple-50">
                    <input type="radio" name="paymentMethod" value="Online" class="accent-purple-600">
                    <div class="flex h-10 w-10 items-center justify-center rounded-xl bg-purple-100 text-purple-600">
                        <i class="fas fa-mobile-alt"></i>
                    </div>
                    <div>
                        <p class="font-semibold text-slate-900">Online Transfer</p>
                        <p class="text-xs text-slate-500">Bank transfer or mobile payment</p>
                    </div>
                </label>
            </div>

            <button type="submit"
                    class="w-full rounded-xl py-3 font-bold text-white text-sm transition"
                    style="background: linear-gradient(135deg,#1a5c38,#2d7a4c)">
                <i class="fas fa-lock mr-2"></i>
                Pay Rs. <span th:text="${#numbers.formatInteger(booking.totalPrice, 1, 'COMMA')}">0</span>
            </button>

            <p class="mt-3 text-center text-xs text-slate-400">
                <i class="fas fa-shield-alt mr-1"></i> Secured by Heaven Hotel payment system
            </p>
        </form>
    </div>

    <!-- Already paid -->
    <div class="rounded-2xl bg-green-50 border border-green-200 p-6 text-center"
         th:if="${booking.paymentStatus == 'PAID'}">
        <i class="fas fa-check-circle text-4xl text-green-500"></i>
        <p class="mt-3 font-bold text-green-800">Payment Already Completed</p>
        <a th:href="@{/invoices/booking/{id}(id=${booking.bookingId})}"
           class="mt-4 inline-block rounded-xl bg-green-600 px-5 py-2 text-sm font-semibold text-white hover:bg-green-700">
            <i class="fas fa-file-invoice mr-1"></i> View Invoice
        </a>
    </div>

</main>
<div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
