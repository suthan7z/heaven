<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Payments - Heaven Hotel</title><script src="https://cdn.tailwindcss.com"></script><link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet"></head>
<body class="min-h-screen bg-slate-50">
    <div th:insert="~{fragments/navbar :: navbar}"></div>
    <main class="mx-auto max-w-6xl px-4 py-10 sm:px-6">
        <h1 class="text-2xl font-bold text-slate-900">Payments</h1>
        <div th:if="${payments != null and !#lists.isEmpty(payments)}" class="mt-6 overflow-hidden rounded-2xl bg-white shadow-sm">
            <table class="w-full text-sm"><thead class="bg-slate-50 text-left text-xs font-semibold uppercase text-slate-500"><tr><th class="px-6 py-4">ID</th><th class="px-6 py-4">Booking</th><th class="px-6 py-4">Amount</th><th class="px-6 py-4">Status</th></tr></thead>
            <tbody class="divide-y divide-slate-100">
                <tr th:each="p : ${payments}" class="hover:bg-slate-50">
                    <td class="px-6 py-4 font-mono text-xs" th:text="${p.paymentId}">-</td>
                    <td class="px-6 py-4" th:text="${p.bookingId}">-</td>
                    <td class="px-6 py-4 font-semibold" th:text="'$' + ${#numbers.formatDecimal(p.amount, 1, 2)}">$0</td>
                    <td class="px-6 py-4"><span class="rounded-full bg-green-100 px-2 py-1 text-xs text-green-700" th:text="${p.status}">-</span></td>
                </tr>
            </tbody></table>
        </div>
        <div th:if="${payments == null or #lists.isEmpty(payments)}" class="mt-10 text-center text-slate-500"><p>No payments found.</p></div>
    </main>
    <div th:insert="~{fragments/footer :: footer}"></div>
</body>
</html>
