<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Heaven Hotel</title>
</head>
<body>
<nav th:fragment="navbar" class="bg-slate-900 text-slate-100 shadow-sm">
    <div class="mx-auto flex max-w-screen-2xl flex-col px-4 py-3 sm:px-6 lg:px-8">
        <div class="flex items-center justify-between gap-4">

            <!-- Logo -->
            <a th:href="@{/}" class="inline-flex items-center gap-2 text-xl font-semibold text-white">
                <i class="fas fa-hotel text-amber-400"></i>
                <span>Heaven Hotel</span>
            </a>

            <!-- Mobile toggle -->
            <button type="button" onclick="toggleMobileMenu()" aria-label="Toggle navigation menu"
                    class="inline-flex items-center justify-center rounded-xl border border-slate-700 bg-slate-800 px-3 py-2 text-slate-100 transition hover:bg-slate-700 md:hidden">
                <i class="fas fa-bars"></i>
            </button>

            <!-- Desktop menu -->
            <div class="hidden items-center gap-1 md:flex">
                <a th:href="@{/dashboard}" sec:authorize="isAuthenticated()"
                   class="rounded-lg px-3 py-2 text-sm font-medium text-slate-200 transition hover:text-amber-400">
                    <i class="fas fa-tachometer-alt mr-1"></i>Dashboard
                </a>
                <a th:href="@{/rooms}"
                   class="rounded-lg px-3 py-2 text-sm font-medium text-slate-200 transition hover:text-amber-400">
                    <i class="fas fa-bed mr-1"></i>Rooms
                </a>
                <a th:href="@{/bookings}" sec:authorize="isAuthenticated()"
                   class="rounded-lg px-3 py-2 text-sm font-medium text-slate-200 transition hover:text-amber-400">
                    <i class="fas fa-calendar mr-1"></i>Bookings
                </a>

                <!-- Logged IN: username dropdown -->
                <div sec:authorize="isAuthenticated()" class="relative group ml-2">
                    <button type="button"
                            class="inline-flex items-center gap-2 rounded-xl bg-slate-800 border border-slate-700 px-3 py-2 text-sm font-medium text-slate-100 transition hover:bg-slate-700">
                        <i class="fas fa-user-circle text-amber-400"></i>
                        <span sec:authentication="name">User</span>
                        <i class="fas fa-chevron-down text-xs text-slate-400"></i>
                    </button>
                    <div class="absolute right-0 top-full z-30 mt-2 hidden min-w-[14rem] rounded-2xl border border-slate-700 bg-slate-950 p-2 shadow-xl group-hover:block">
                        <a th:href="@{/profile}" class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm text-slate-100 transition hover:bg-slate-800">
                            <i class="fas fa-user w-4 text-slate-400"></i>My Profile
                        </a>
                        <a th:href="@{/bookings/list/all}" class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm text-slate-100 transition hover:bg-slate-800">
                            <i class="fas fa-list w-4 text-slate-400"></i>My Bookings
                        </a>
                        <a th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')"
                           class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm text-slate-100 transition hover:bg-slate-800">
                            <i class="fas fa-shield-alt w-4 text-amber-400"></i>Admin Panel
                        </a>
                        <div class="my-1 h-px bg-slate-800"></div>
                        <form th:action="@{/logout}" method="post">
                            <button type="submit"
                                    class="flex w-full items-center gap-2 rounded-xl px-3 py-2 text-sm text-red-400 transition hover:bg-slate-800 hover:text-red-300">
                                <i class="fas fa-sign-out-alt w-4"></i>Logout
                            </button>
                        </form>
                    </div>
                </div>

                <!-- NOT logged in: login button -->
                <div sec:authorize="!isAuthenticated()" class="flex items-center gap-2 ml-2">
                    <a th:href="@{/login}"
                       class="rounded-xl border border-slate-600 px-4 py-2 text-sm font-medium text-slate-200 transition hover:bg-slate-800">
                        <i class="fas fa-sign-in-alt mr-1"></i>Login
                    </a>
                    <a th:href="@{/register}"
                       class="rounded-xl bg-amber-500 px-4 py-2 text-sm font-medium text-white transition hover:bg-amber-600">
                        <i class="fas fa-user-plus mr-1"></i>Register
                    </a>
                </div>
            </div>
        </div>

        <!-- Mobile menu -->
        <div id="mobile-menu" class="hidden mt-3 space-y-1 rounded-2xl border border-slate-700 bg-slate-950 p-3 md:hidden">
            <a th:href="@{/dashboard}" sec:authorize="isAuthenticated()"
               class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm text-slate-100 hover:bg-slate-800">
                <i class="fas fa-tachometer-alt w-4 text-slate-400"></i>Dashboard
            </a>
            <a th:href="@{/rooms}" class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm text-slate-100 hover:bg-slate-800">
                <i class="fas fa-bed w-4 text-slate-400"></i>Rooms
            </a>
            <a th:href="@{/bookings}" sec:authorize="isAuthenticated()"
               class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm text-slate-100 hover:bg-slate-800">
                <i class="fas fa-calendar w-4 text-slate-400"></i>Bookings
            </a>

            <!-- Logged in mobile -->
            <div sec:authorize="isAuthenticated()" class="border-t border-slate-800 pt-2 mt-2 space-y-1">
                <p class="px-3 py-1 text-xs font-semibold uppercase tracking-wide text-slate-500">
                    Signed in as <span sec:authentication="name" class="text-amber-400"></span>
                </p>
                <a th:href="@{/profile}" class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm text-slate-100 hover:bg-slate-800">
                    <i class="fas fa-user w-4 text-slate-400"></i>My Profile
                </a>
                <a th:href="@{/admin/dashboard}" sec:authorize="hasRole('ADMIN')"
                   class="flex items-center gap-2 rounded-xl px-3 py-2 text-sm text-slate-100 hover:bg-slate-800">
                    <i class="fas fa-shield-alt w-4 text-amber-400"></i>Admin Panel
                </a>
                <form th:action="@{/logout}" method="post">
                    <button type="submit"
                            class="flex w-full items-center gap-2 rounded-xl px-3 py-2 text-sm text-red-400 hover:bg-slate-800">
                        <i class="fas fa-sign-out-alt w-4"></i>Logout
                    </button>
                </form>
            </div>

            <!-- Not logged in mobile -->
            <div sec:authorize="!isAuthenticated()" class="border-t border-slate-800 pt-2 mt-2 grid grid-cols-2 gap-2">
                <a th:href="@{/login}"
                   class="rounded-xl border border-slate-600 px-3 py-2 text-center text-sm font-medium text-slate-200 hover:bg-slate-800">
                    Login
                </a>
                <a th:href="@{/register}"
                   class="rounded-xl bg-amber-500 px-3 py-2 text-center text-sm font-medium text-white hover:bg-amber-600">
                    Register
                </a>
            </div>
        </div>
    </div>
</nav>

<script th:inline="javascript">
function toggleMobileMenu() {
    const menu = document.getElementById('mobile-menu');
    menu.classList.toggle('hidden');
}
</script>
</body>
</html>
