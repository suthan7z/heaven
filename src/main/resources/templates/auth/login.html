<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Heaven Hotel</title>
    
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" th:href="@{/static/css/style.css}">
    <link rel="stylesheet" th:href="@{/static/css/auth.css}">
</head>
<body>
    <div class="auth-container">
        <div class="auth-form-wrapper auth-form-narrow">
            <h2>
                <i class="fas fa-sign-in-alt"></i> Welcome Back
            </h2>
            <p class="form-subtitle">Login to your Heaven Hotel account</p>
            
            <!-- Error Messages -->
            <div th:if="${errorMessage}" class="alert alert-danger" role="alert">
                <i class="fas fa-exclamation-circle"></i> <span th:text="${errorMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">×</button>
            </div>
            
            <!-- Success Messages -->
            <div th:if="${successMessage}" class="alert alert-success" role="alert">
                <i class="fas fa-check-circle"></i> <span th:text="${successMessage}"></span>
                <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close">×</button>
            </div>
            
            <!-- Login Form -->
            <form method="post" th:action="@{/auth/login}" class="needs-validation" novalidate>
                <div class="form-group">
                    <label for="username" class="form-label">Username or Email</label>
                    <input 
                        type="text" 
                        id="username" 
                        name="username" 
                        class="form-control" 
                        placeholder="Enter your username or email"
                        required
                        autofocus>
                    <div class="invalid-feedback">
                        Please provide a valid username or email.
                    </div>
                </div>
                
                <div class="form-group">
                    <label for="password" class="form-label">Password</label>
                    <div class="password-toggle">
                        <input 
                            type="password" 
                            id="password" 
                            name="password" 
                            class="form-control" 
                            placeholder="Enter your password"
                            required>
                        <button 
                            type="button" 
                            class="toggle-btn" 
                            title="Toggle password visibility"
                            aria-label="Toggle password visibility"
                            onclick="togglePasswordVisibility('password')">
                            <i class="fas fa-eye"></i>
                        </button>
                    </div>
                    <div class="invalid-feedback">
                        Please provide your password.
                    </div>
                </div>
                
                <div class="form-remember-me">
                    <input 
                        type="checkbox" 
                        id="rememberMe" 
                        name="remember-me">
                    <label for="rememberMe">
                        Remember me
                    </label>
                </div>
                
                <button type="submit" class="btn-submit">
                    <i class="fas fa-sign-in-alt"></i> Login
                </button>
            </form>
            
            <!-- Links -->
            <div class="forgot-password-link">
                <a href="/forgot-password">
                    <i class="fas fa-key"></i> Forgot Password?
                </a>
            </div>
            
            <div class="auth-divider">
                <span>Don't have an account?</span>
            </div>
            
            <div class="auth-footer">
                <a th:href="@{/register}" class="btn btn-outline-primary w-full justify-center">
                    <i class="fas fa-user-plus"></i> Create Account
                </a>
            </div>
            
            <div class="auth-footer auth-footer-centered">
                <small class="text-muted">
                    Having issues? <a href="/contact">Contact Support</a>
                </small>
            </div>
        </div>
    </div>
    
    <script th:src="@{/static/js/app.js}"></script>
    <script>
        function togglePasswordVisibility(event, inputId) {
            const input = document.getElementById(inputId);
            const button = event.target.closest('.toggle-btn');
            
            if (!input || !button) {
                return;
            }
            
            if (input.type === 'password') {
                input.type = 'text';
                button.innerHTML = '<i class="fas fa-eye-slash"></i>';
            } else {
                input.type = 'password';
                button.innerHTML = '<i class="fas fa-eye"></i>';
            }
        }
        
        // Initialize form validation
        document.addEventListener('DOMContentLoaded', function() {
            const form = document.querySelector('.needs-validation');
            form.addEventListener('submit', function(event) {
                if (!form.checkValidity()) {
                    event.preventDefault();
                    event.stopPropagation();
                }
                form.classList.add('was-validated');
            }, false);
        });
    </script>
</body>
</html>
