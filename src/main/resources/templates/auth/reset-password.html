<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password - Heaven Hotel</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
</head>
<body class="min-h-screen bg-slate-100 flex items-center justify-center px-4">
<div class="w-full max-w-md bg-white rounded-2xl shadow-lg p-8">

    <div class="text-center mb-6">
        <a th:href="@{/}" class="text-2xl font-bold text-slate-900"><i class="fas fa-hotel text-blue-600 mr-2"></i>Heaven Hotel</a>
        <h1 class="mt-3 text-xl font-semibold text-slate-800">Reset Password</h1>
        <p class="mt-1 text-sm text-slate-500">Create a new password for your account</p>
    </div>

    <div th:if="${errorMessage}" class="mb-4 rounded-xl bg-red-50 border border-red-200 p-3 text-sm text-red-700">
        <i class="fas fa-exclamation-circle mr-1"></i><span th:text="${errorMessage}"></span>
    </div>

    <form method="post" th:action="@{/auth/reset-password}" id="resetForm" class="space-y-4">
        <input type="hidden" name="token" th:value="${token}">
        <div>
            <label class="block mb-1 text-sm font-medium text-slate-700">New Password</label>
            <div class="relative">
                <input type="password" id="newPassword" name="newPassword" placeholder="Enter new password" required
                       class="w-full rounded-xl border border-slate-300 px-3 py-2 pr-10 text-sm focus:border-blue-500 focus:outline-none"
                       oninput="checkStrength(this.value)">
                <button type="button" onclick="togglePwd('newPassword',this)" class="absolute right-3 top-2.5 text-slate-400"><i class="fas fa-eye text-sm"></i></button>
            </div>
            <div class="mt-1 h-1 rounded-full bg-slate-200 overflow-hidden"><div id="strengthFill" class="h-full rounded-full transition-all w-0"></div></div>
            <p id="strengthLabel" class="mt-1 text-xs text-slate-400"></p>
        </div>
        <div>
            <label class="block mb-1 text-sm font-medium text-slate-700">Confirm Password</label>
            <div class="relative">
                <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Repeat new password" required
                       class="w-full rounded-xl border border-slate-300 px-3 py-2 pr-10 text-sm focus:border-blue-500 focus:outline-none">
                <button type="button" onclick="togglePwd('confirmPassword',this)" class="absolute right-3 top-2.5 text-slate-400"><i class="fas fa-eye text-sm"></i></button>
            </div>
            <p id="matchMsg" class="mt-1 text-xs hidden"></p>
        </div>
        <button type="submit" class="w-full rounded-xl bg-blue-600 py-2.5 text-sm font-semibold text-white hover:bg-blue-700">
            <i class="fas fa-check mr-1"></i> Reset Password
        </button>
    </form>
    <div class="mt-4 text-center">
        <a th:href="@{/login}" class="text-sm text-blue-600 hover:underline"><i class="fas fa-arrow-left mr-1"></i> Back to Login</a>
    </div>
</div>
<script>
function togglePwd(id,btn){const i=document.getElementById(id),t=i.type==='text';i.type=t?'password':'text';btn.querySelector('i').className=t?'fas fa-eye text-sm':'fas fa-eye-slash text-sm';}
function checkStrength(p){let s=0;if(p.length>=8)s++;if(p.length>=12)s++;if(/[a-z]/.test(p))s++;if(/[A-Z]/.test(p))s++;if(/\d/.test(p))s++;if(/[^A-Za-z0-9]/.test(p))s++;const pct=Math.min(100,Math.round(s/6*100));const f=document.getElementById('strengthFill');f.style.width=pct+'%';f.className='h-full rounded-full transition-all '+(pct>=84?'bg-emerald-600':pct>=68?'bg-green-500':pct>=51?'bg-yellow-400':pct>=34?'bg-orange-400':'bg-red-500');document.getElementById('strengthLabel').textContent=pct>=84?'Very Strong':pct>=68?'Strong':pct>=51?'Good':pct>=34?'Fair':'Weak';}
document.addEventListener('DOMContentLoaded',()=>{const p=document.getElementById('newPassword'),c=document.getElementById('confirmPassword'),m=document.getElementById('matchMsg');c.addEventListener('input',()=>{if(!c.value){m.classList.add('hidden');return;}const ok=p.value===c.value;m.classList.remove('hidden');m.textContent=ok?'✓ Passwords match':'✗ Passwords do not match';m.className='mt-1 text-xs '+(ok?'text-green-600':'text-red-500');c.setCustomValidity(ok?'':'Passwords do not match');});});
</script>
</body>
</html>
