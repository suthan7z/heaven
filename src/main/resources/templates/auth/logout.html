<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head><meta charset="UTF-8"><title>Logout - Heaven Hotel</title><script src="https://cdn.tailwindcss.com"></script></head>
<body class="min-h-screen bg-slate-50 flex items-center justify-center">
    <div class="rounded-2xl bg-white p-10 shadow-sm text-center max-w-sm w-full">
        <i class="fas fa-sign-out-alt text-5xl text-slate-400"></i>
        <h1 class="mt-4 text-xl font-bold text-slate-900">Sign Out</h1>
        <p class="mt-2 text-slate-500">Are you sure you want to sign out?</p>
        <form th:action="@{/logout}" method="post" class="mt-6">
            <button type="submit" class="w-full rounded-xl bg-red-600 py-2 font-medium text-white hover:bg-red-700">Sign Out</button>
        </form>
        <a th:href="@{/dashboard}" class="mt-3 block text-sm text-blue-600 hover:underline">Cancel</a>
    </div>
</body>
</html>
